version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cc-erp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cakes_candles_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cc-erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  adminer:
    image: adminer:latest
    container_name: cc-erp-adminer
    restart: always
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: cc-erp-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

volumes:
  pgdata:
  redisdata:
