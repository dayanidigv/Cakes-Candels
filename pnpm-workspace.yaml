packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@nestjs/core": true
  bcrypt: true
  esbuild: true
  '@scarf/scarf': set this to true or false
  '@parcel/watcher': set this to true or false
  unrs-resolver: set this to true or false
